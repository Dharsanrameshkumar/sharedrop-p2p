# Use Render's PORT env var in production, fallback to 8080 for local dev
server.port=${PORT:8080}

# Allow connections from other devices on the same Wi-Fi
server.address=0.0.0.0

# Serve the frontend files directly from Spring Boot
# This lets one command (mvn spring-boot:run) serve everything
spring.web.resources.static-locations=file:../frontend/
